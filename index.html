<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Children's Church Lesson Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Children's Church Lesson Planner</h1>
    <div class="lesson-details">
    <h2>Lesson Details</h2>

    <label for="lesson-title">Lesson Title:</label>
    <input type="text" id="lesson-title">

    <label for="age-group">Age Group:</label>
    <input type="text" id="age-group">

    <label for="bible-verse">Bible Verse:</label>
    <input type="text" id="bible-verse">
</div>

    <div class="lesson-content">
    <h2>Lesson Content</h2>

    <label for="lesson-summary">Lesson Summary:</label>
    <textarea id="lesson-summary"></textarea>

    <label for="activities">Activities:</label>
    <textarea id="activities"></textarea>

    <label for="prayer">Prayer:</label>
    <textarea id="prayer"></textarea>
</div>

    <button id="save-lesson">Save Lesson</button>

    <button id="save-lesson">Save Lesson</button>

<script src="script.js"></script>
</body>
</html>
</body>
</html>
